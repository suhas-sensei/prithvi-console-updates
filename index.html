<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prithvi Console Updates</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  :root { --paper:#f6f5f2; --surface:#fff; --ink:#252422; --muted:#6f6d68; --line:#e4e2dc; --accent:#2383e2; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --paper:#121212; --surface:#1b1b1b; --ink:#ecebe8; --muted:#a3a09a; --line:#2d2c2a; --accent:#5aa6ef; color-scheme: dark; } }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 "IBM Plex Sans", system-ui, sans-serif; padding:48px 20px; }
  main { max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:24px; }
  .eyebrow { font:12px "IBM Plex Mono", ui-monospace, monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  h1 { font-size:34px; line-height:1.15; margin:0; letter-spacing:-.02em; }
  p { margin:0; color:var(--muted); }
  ul { list-style:none; margin:0; padding:0; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
  li + li { border-top:1px solid var(--line); }
  a { display:flex; justify-content:space-between; gap:16px; padding:16px 18px; color:inherit; text-decoration:none; }
  a:hover, a:focus-visible { color:var(--accent); outline:none; }
  time { font:13px "IBM Plex Mono", ui-monospace, monospace; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>
<main>
  <span class="eyebrow">Prithvi console</span>
  <h1>What changed, day by day</h1>
  <p>Short guides for the CX team: what's new on screen and what to do differently.</p>
  <ul>
    <li><a href="console-changes-29-sep.html"><span>Follow up, Assign, De-escalate, On call, dark mode and more</span><time datetime="2026-09-29">29 Sep 2026</time></a></li>
  </ul>
</main>
</body>
</html>
